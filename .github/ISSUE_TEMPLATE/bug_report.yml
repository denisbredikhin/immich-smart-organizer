name: Bug report
description: Report a reproducible problem.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: Do not include API keys, private Immich URLs, asset IDs, or personal media.
  - type: input
    id: version
    attributes:
      label: Tool version
      description: Include the output of `immich-smart-organizer --version`.
    validations:
      required: true
  - type: input
    id: immich-version
    attributes:
      label: Immich version
      description: Include the server version, if known.
    validations:
      required: false
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Provide the smallest safe reproduction. Redact host names and identifiers.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Redact secrets and personal information.
    validations:
      required: true
